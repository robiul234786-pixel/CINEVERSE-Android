<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CINEVERSE</title>
<!--
SETUP (Firebase ছাড়াও চলবে — তখন ডেমো/লোকাল মোড):
1) Firebase Console → Authentication: Email/Password (+Google) চালু করো।
2) Firestore Database তৈরি করো। Rules:
   rules_version='2'; service cloud.firestore { match /databases/{d}/documents {
     match /titles/{t} { allow read: if request.auth!=null;
       allow write: if request.auth!=null && request.auth.token.email in ['তোমার-ইমেইল@gmail.com']; }
     match /users/{u} { allow read,write: if request.auth!=null && request.auth.uid==u; } } }
3) নিচে FIREBASE_CONFIG ও ADMIN_EMAILS বসাও। Cloudflare Pages-এ index.html নামে আপলোড করো।
-->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#090a0e;--panel:#171922;--gold:#e7b85c;--muted:#9a9eaa;--ind:#34303a;color-scheme:dark}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:#fff;font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:480px;height:100%;display:flex;flex-direction:column;position:relative;padding-top:env(safe-area-inset-top,0px)}
main{flex:1;overflow-y:auto;padding:0 16px 16px}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 4px}
.logo{color:var(--gold);font-weight:900;font-size:22px;letter-spacing:2px}
.tag{color:var(--muted);font-size:8px;letter-spacing:1.4px}
.ib{background:none;border:0;color:#fff;font-size:20px;padding:8px;cursor:pointer}
.hero{height:190px;border-radius:22px;padding:20px;display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(135deg,#49351d,#171922,#11131b)}
.hero small{color:var(--gold);font-size:10px;letter-spacing:1.5px}.hero h2{font-size:27px;line-height:1.15;margin:8px 0 10px}.hero p{color:#ccc;font-size:12px}
h3{font-size:17px;margin:22px 0 10px}
.row{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.card{flex:0 0 120px;cursor:pointer}
.poster{height:170px;border-radius:14px;position:relative;display:flex;align-items:flex-end;padding:8px;font-weight:700;font-size:13px;line-height:1.2;overflow:hidden;background-size:cover;background-position:center;text-shadow:0 1px 4px #000}
.poster .yr{position:absolute;top:8px;right:8px;background:#0008;border-radius:8px;padding:2px 6px;font-size:10px;font-weight:600}
.card .m{color:var(--muted);font-size:11px;margin-top:5px}
.bar{height:3px;background:#fff3;border-radius:3px;margin-top:5px}.bar i{display:block;height:100%;background:var(--gold);border-radius:3px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.chip{background:var(--panel);color:#fff;border:0;border-radius:50px;padding:10px 16px;font-size:12px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--gold);color:#111;font-weight:700}
.empty{background:var(--panel);border-radius:16px;padding:15px;color:var(--muted);font-size:12px}.empty b{display:block;color:#fff;font-size:14px;margin-bottom:2px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.grid .card{flex:none}.grid .poster{height:150px}
input,select,textarea{width:100%;background:var(--panel);border:1px solid transparent;border-radius:12px;color:#fff;padding:13px 14px;font-size:14px;outline:none;margin-top:8px;font-family:inherit}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
nav{display:flex;background:var(--panel);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;border:0;color:var(--muted);font-size:10px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav button span{font-size:19px;padding:3px 14px;border-radius:50px}nav button.on{color:var(--gold)}nav button.on span{background:var(--ind)}
.prof{text-align:center;padding-top:40px}
.av{width:86px;height:86px;border-radius:50%;background:linear-gradient(135deg,var(--gold),#49351d);margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:36px}
.btn{background:var(--gold);color:#111;border:0;border-radius:50px;padding:12px 26px;font-weight:700;font-size:14px;cursor:pointer;margin-top:12px}
.btn.g{background:var(--panel);color:#fff}.btn.w{width:100%}.btn.r{background:#7a2530;color:#fff}
.stats{display:flex;gap:10px;margin-top:24px}.stats div{flex:1;background:var(--panel);border-radius:14px;padding:14px}.stats b{display:block;font-size:22px;color:var(--gold)}.stats small{color:var(--muted);font-size:11px}
#modal{position:absolute;inset:0;background:var(--bg);display:none;flex-direction:column;overflow-y:auto;z-index:5;padding-top:env(safe-area-inset-top,0px)}#modal.show{display:flex}
.player{height:230px;display:flex;align-items:center;justify-content:center;position:relative;flex:none;background-size:cover;background-position:center}
.player iframe{width:100%;height:100%;border:0}
.play{width:64px;height:64px;border-radius:50%;background:var(--gold);color:#111;border:0;font-size:26px;cursor:pointer}
.pb{position:absolute;left:0;right:0;bottom:0;height:4px;background:#fff3}.pb i{display:block;height:100%;background:var(--gold);width:0}
.close{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:10px;background:#0009;border:0;color:#fff;width:38px;height:38px;border-radius:50%;font-size:18px;cursor:pointer;z-index:2}
.det{padding:18px}.det h2{font-size:24px}.det .meta{color:var(--muted);font-size:12px;margin:6px 0 14px}.det p{color:#ccc;font-size:14px;line-height:1.6}
.acts{display:flex;gap:10px;margin-top:16px}.acts .btn{margin:0;flex:1}
.auth{flex:1;display:flex;flex-direction:column;justify-content:center;padding:28px;text-align:center}
.auth .logo{font-size:30px}.auth p.e{color:#ff8a8a;font-size:12px;margin-top:10px;min-height:16px}
.link{background:none;border:0;color:var(--gold);font-size:13px;margin-top:16px;cursor:pointer}
.arow{display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:12px;padding:10px;margin-top:8px;font-size:13px}.arow b{flex:1}
.arow button{background:var(--ind);border:0;color:#fff;border-radius:8px;padding:7px 10px;font-size:12px;cursor:pointer}
.badge{font-size:10px;background:var(--gold);color:#111;border-radius:6px;padding:2px 6px;margin-left:6px}
#toast{position:absolute;bottom:90px;left:50%;transform:translateX(-50%);background:var(--gold);color:#111;padding:9px 18px;border-radius:50px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:9;white-space:nowrap}#toast.show{opacity:1}
</style>
</head>
<body>
<div id="app"><main id="main"></main><nav id="nav"></nav><div id="modal"></div><div id="toast"></div></div>
<script>
/* ====== CONFIG ====== */
const FIREBASE_CONFIG = null; // {apiKey:"...",authDomain:"...",projectId:"...",appId:"..."}
const ADMIN_EMAILS = [];      // Firebase মোডে অ্যাডমিন ইমেইল
/* ==================== */
const FB = !!FIREBASE_CONFIG && typeof firebase!=="undefined";
let auth,db; if(FB){firebase.initializeApp(FIREBASE_CONFIG);auth=firebase.auth();db=firebase.firestore();}
const ls=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const $=s=>document.querySelector(s);
const CATS=["সব","মুভি","সিরিজ","ড্রামা","শর্ট ফিল্ম","YouTube"];
const SEED=[["নীল আকাশের নিচে","মুভি",2024,"1h 52m","একটি ছোট শহরের গল্প।"],["শেষ ট্রেন","ড্রামা",2023,"1h 38m","মধ্যরাতের স্টেশনে অচেনা যাত্রীদের গল্প।"],["ছায়ার শহর","সিরিজ",2025,"৮ এপিসোড","এক গোয়েন্দা ও রহস্যময় শহর।"],["বৃষ্টির দিন","শর্ট ফিল্ম",2024,"18m","বৃষ্টির বিকেলে দুই বন্ধুর দেখা।"]].map((m,i)=>({id:"s"+i,t:m[0],c:m[1],y:m[2],d:m[3],s:m[4],yt:"",ts:i}));
const G=[["#7a3b1d","#1d1209"],["#1d4a6b","#0a1620"],["#5b2a6e","#160b1c"],["#2f6b4a","#0b1c13"],["#8a2f3d","#1f0b10"],["#6b5a1d","#1c1709"]];
const ytId=v=>{v=(v||"").trim();const m=v.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/);return m?m[1]:(/^[\w-]{11}$/.test(v)?v:"")};
const hash=s=>[...String(s)].reduce((a,c)=>a+c.charCodeAt(0),0);
let st={tab:"home",cat:"সব",q:"",user:null,admin:false,titles:[],list:[],prog:{},mode:"in",err:"",edit:null};
const T=id=>st.titles.find(x=>x.id==id);

/* ====== DATA LAYER ====== */
const D={
 init(){
  if(FB){auth.onAuthStateChanged(async u=>{ if(!u){st.user=null;return render()}
    st.user={id:u.uid,email:u.email,name:u.displayName||u.email.split("@")[0]};
    st.admin=ADMIN_EMAILS.includes(u.email);
    const p=await db.collection("users").doc(u.uid).get();const d=p.exists?p.data():{};
    st.list=d.list||[];st.prog=d.prog||{};if(d.name)st.user.name=d.name;
    db.collection("titles").orderBy("ts","desc").onSnapshot(s=>{st.titles=s.docs.map(x=>({id:x.id,...x.data()}));render()},e=>{toast("ডেটা লোড হয়নি");});
    render();});}
  else{const e=ls("cv_sess",null);if(e)D.local(e);else render();}
 },
 local(email){const u=ls("cv_users",{})[email];st.user={id:email,email,name:u.name};st.admin=ls("cv_admin","")===email;
  const p=ls("cv_p_"+email,{});st.list=p.list||[];st.prog=p.prog||{};st.titles=ls("cv_titles",null)||SEED;render()},
 async signup(email,pw,name){
  if(FB){const c=await auth.createUserWithEmailAndPassword(email,pw);await c.user.updateProfile({displayName:name});
    await db.collection("users").doc(c.user.uid).set({name},{merge:true});st.user.name=name;render();}
  else{const u=ls("cv_users",{});if(u[email])throw Error("এই ইমেইল আগে থেকেই আছে");u[email]={pw,name};sv("cv_users",u);
    if(!ls("cv_admin",""))sv("cv_admin",email);sv("cv_sess",email);D.local(email);}
 },
 async login(email,pw){
  if(FB)await auth.signInWithEmailAndPassword(email,pw);
  else{const u=ls("cv_users",{})[email];if(!u||u.pw!==pw)throw Error("ইমেইল বা পাসওয়ার্ড ভুল");sv("cv_sess",email);D.local(email);}
 },
 async google(){const p=new firebase.auth.GoogleAuthProvider();await auth.signInWithPopup(p)},
 logout(){if(FB)auth.signOut();else{sv("cv_sess",null);st.user=null;render()}},
 saveUser(){const d={list:st.list,prog:st.prog,name:st.user.name};
  if(FB)db.collection("users").doc(st.user.id).set(d,{merge:true});else sv("cv_p_"+st.user.email,d)},
 async saveTitle(t){const id=t.id;delete t.id;t.ts=t.ts||Date.now();
  if(FB){id?await db.collection("titles").doc(id).set(t):await db.collection("titles").add(t)}
  else{const L=st.titles.slice();if(id){const i=L.findIndex(x=>x.id==id);L[i]={...t,id}}else L.unshift({...t,id:"t"+Date.now()});sv("cv_titles",L);st.titles=L;render()}},
 async delTitle(id){if(FB)await db.collection("titles").doc(id).delete();else{st.titles=st.titles.filter(x=>x.id!=id);sv("cv_titles",st.titles);render()}}
};

/* ====== UI ====== */
const poster=m=>{const g=G[hash(m.id)%G.length];const bg=m.yt?`background-image:linear-gradient(#0000,#000a),url(https://i.ytimg.com/vi/${m.yt}/hqdefault.jpg)`:`background:linear-gradient(160deg,${g[0]},${g[1]})`;
 return `<div class="poster" style="${bg}"><span class="yr">${m.y||""}</span>${m.t}</div>`};
const card=(m,bar)=>`<div class="card" onclick="openM('${m.id}')">${poster(m)}<div class="m">${m.c} • ${m.d||""}</div>${bar?`<div class="bar"><i style="width:${st.prog[m.id]||0}%"></i></div>`:""}</div>`;
const flt=()=>st.titles.filter(m=>(st.cat==="সব"||m.c===st.cat)&&m.t.includes(st.q));
const chips=go=>`<div class="chips">${CATS.map(c=>`<button class="chip ${st.cat===c?"on":""}" onclick="${go?"setCatGo":"setCat"}('${c}')">${c}</button>`).join("")}</div>`;
const none=(a,b)=>`<div class="empty"><b>${a}</b>${b}</div>`;

function render(){
  if(!st.user){$("#nav").style.display="none";return authView()}
  $("#nav").style.display="";
  const tabs=[["home","⌂","হোম"],["explore","⌕","এক্সপ্লোর"],["list","🔖","মাই লিস্ট"],...(st.admin?[["admin","⚙","অ্যাডমিন"]]:[]),["me","☺","প্রোফাইল"]];
  $("#nav").innerHTML=tabs.map(t=>`<button class="${st.tab===t[0]?"on":""}" onclick="go('${t[0]}')"><span>${t[1]}</span>${t[2]}</button>`).join("");
  const A=st.titles;let h="";
  if(st.tab==="home"){
    const cont=A.filter(m=>st.prog[m.id]>0&&st.prog[m.id]<100);
    h=`<header><div><div class="logo">CINEVERSE</div><div class="tag">YOUR WORLD OF ENTERTAINMENT</div></div><button class="ib" onclick="go('explore')">⌕</button></header>
    <div class="hero"><small>THE NEXT STORY STARTS HERE</small><h2>আপনার পরবর্তী<br>প্রিয় গল্প খুঁজুন।</h2><p>মুভি • সিরিজ • শর্ট ফিল্ম • YouTube</p></div>
    <h3>ট্রেন্ডিং</h3>${A.length?`<div class="row">${A.slice(0,8).map(m=>card(m)).join("")}</div>`:none("এখনো কিছু যোগ হয়নি","অ্যাডমিন টাইটেল যোগ করলে এখানে দেখাবে।")}
    <h3>দেখা চালিয়ে যান</h3>${cont.length?`<div class="row">${cont.map(m=>card(m,1)).join("")}</div>`:none("কিছু নেই","যা দেখবেন তা এখানে আসবে।")}
    <h3>ক্যাটাগরি</h3>${chips(1)}`;
  }else if(st.tab==="explore"){
    h=`<header><div class="logo">এক্সপ্লোর</div></header><input id="q" placeholder="নাম দিয়ে খুঁজুন…" value="${st.q}" oninput="st.q=this.value;grid()"><div style="margin-top:12px">${chips()}</div><div class="grid" id="grid"></div>`;
  }else if(st.tab==="list"){
    const L=A.filter(m=>st.list.includes(m.id));
    h=`<header><div class="logo">মাই লিস্ট</div></header>${L.length?`<div class="grid">${L.map(m=>card(m)).join("")}</div>`:none("লিস্ট খালি","পছন্দের টাইটেল সেভ করলে এখানে দেখাবে।")}`;
  }else if(st.tab==="admin"&&st.admin){
    const e=st.edit||{};
    h=`<header><div class="logo">অ্যাডমিন</div></header>
    <b style="font-size:14px">${e.id?"টাইটেল এডিট":"নতুন টাইটেল"}</b>
    <input id="a_t" placeholder="নাম" value="${e.t||""}">
    <select id="a_c">${CATS.slice(1).map(c=>`<option ${e.c===c?"selected":""}>${c}</option>`).join("")}</select>
    <input id="a_y" type="number" placeholder="সাল" value="${e.y||new Date().getFullYear()}">
    <input id="a_d" placeholder="সময় (যেমন 1h 30m)" value="${e.d||""}">
    <input id="a_yt" placeholder="YouTube লিংক বা ভিডিও ID (ঐচ্ছিক)" value="${e.yt?"https://youtu.be/"+e.yt:""}">
    <textarea id="a_s" rows="3" placeholder="বিবরণ">${e.s||""}</textarea>
    <button class="btn w" onclick="saveT('${e.id||""}')">${e.id?"আপডেট":"যোগ করুন"}</button>
    ${e.id?`<button class="btn g w" onclick="st.edit=null;render()">বাতিল</button>`:""}
    <h3>সব টাইটেল (${A.length})</h3>${A.map(m=>`<div class="arow"><b>${m.t}</b><button onclick="editT('${m.id}')">এডিট</button><button onclick="delT('${m.id}')">মুছুন</button></div>`).join("")||none("খালি","উপরে ফর্ম দিয়ে যোগ করুন।")}`;
  }else{
    h=`<div class="prof"><div class="av">☺</div><h2>${st.user.name}${st.admin?'<span class="badge">ADMIN</span>':""}</h2><p style="color:var(--muted);font-size:13px;margin-top:4px">${st.user.email}</p>
    <div class="stats"><div><b>${st.list.length}</b><small>সেভ করা</small></div><div><b>${Object.keys(st.prog).length}</b><small>দেখা শুরু</small></div></div>
    <button class="btn g w" onclick="rename()">নাম বদলান</button><button class="btn r w" onclick="D.logout()">লগআউট</button>
    ${FB?"":'<p style="color:var(--muted);font-size:11px;margin-top:18px">ডেমো মোড: ডেটা শুধু এই ব্রাউজারে থাকে। Firebase config দিলে অনলাইন হবে।</p>'}</div>`;
  }
  $("#main").innerHTML=h;if(st.tab==="explore")grid();
}
function authView(){
  const up=st.mode==="up";
  $("#main").innerHTML=`<div class="auth"><div class="logo">CINEVERSE</div><div class="tag" style="margin-bottom:26px">YOUR WORLD OF ENTERTAINMENT</div>
  ${up?'<input id="n" placeholder="আপনার নাম">':""}<input id="e" type="email" placeholder="ইমেইল"><input id="p" type="password" placeholder="পাসওয়ার্ড (৬+ অক্ষর)">
  <p class="e" id="err">${st.err}</p>
  <button class="btn w" onclick="doAuth()">${up?"সাইন আপ":"লগইন"}</button>
  ${FB?'<button class="btn g w" onclick="doGoogle()">Google দিয়ে চালিয়ে যান</button>':""}
  <button class="link" onclick="st.mode='${up?"in":"up"}';st.err='';render()">${up?"আগে থেকেই অ্যাকাউন্ট আছে? লগইন":"নতুন? অ্যাকাউন্ট খুলুন"}</button>
  ${FB?"":'<p style="color:var(--muted);font-size:11px;margin-top:14px">ডেমো মোড — প্রথম সাইন আপ করা ইউজার অ্যাডমিন হবে।</p>'}</div>`;
}
async function doAuth(){
  const e=$("#e").value.trim(),p=$("#p").value,n=$("#n")?$("#n").value.trim():"";
  try{if(st.mode==="up"){if(!n||p.length<6)throw Error("নাম ও ৬+ অক্ষরের পাসওয়ার্ড দিন");await D.signup(e,p,n)}else await D.login(e,p);st.err=""}
  catch(x){st.err=x.message.replace("Firebase: ","");$("#err").textContent=st.err}
}
async function doGoogle(){try{await D.google()}catch(x){$("#err").textContent=x.message}}
function grid(){const f=flt();$("#grid").innerHTML=f.length?f.map(m=>card(m)).join(""):`<div class="empty" style="grid-column:1/4">কিছু পাওয়া যায়নি।</div>`}
function go(t){st.tab=t;render()}
function setCat(c){st.cat=c;render()}
function setCatGo(c){st.cat=c;go("explore")}

/* ====== PLAYER ====== */
let timer=null;
function openM(id){
  const m=T(id);if(!m)return;const saved=st.list.includes(id),p=st.prog[id]||0;
  const g=G[hash(id)%G.length];
  $("#modal").innerHTML=`<button class="close" onclick="closeM()">✕</button>
  <div class="player" id="pv" style="background:${m.yt?`#000 url(https://i.ytimg.com/vi/${m.yt}/hqdefault.jpg) center/cover`:`linear-gradient(160deg,${g[0]},${g[1]})`}"><button class="play" id="pl" onclick="play('${id}')">▶</button>${m.yt?"":`<div class="pb"><i id="pi" style="width:${p}%"></i></div>`}</div>
  <div class="det"><h2>${m.t}</h2><div class="meta">${m.c} • ${m.y||""} • ${m.d||""}</div><p>${m.s||""}</p>
  <div class="acts"><button class="btn" onclick="play('${id}')">${p>0&&p<100?"চালিয়ে যান":"দেখুন"}</button><button class="btn g" id="sv" onclick="toggleList('${id}')">${saved?"✓ সেভড":"+ লিস্টে"}</button></div></div>`;
  $("#modal").classList.add("show");
}
function closeM(){clearInterval(timer);timer=null;$("#pv")&&($("#pv").innerHTML="");$("#modal").classList.remove("show");render()}
function play(id){
  const m=T(id);
  if(m.yt){ if(!st.prog[id]){st.prog[id]=5;D.saveUser()}
    $("#pv").innerHTML=`<iframe src="https://www.youtube.com/embed/${m.yt}?autoplay=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;return}
  const b=$("#pl");if(!b)return;
  if(timer){clearInterval(timer);timer=null;b.textContent="▶";return}
  b.textContent="❚❚";if((st.prog[id]||0)>=100)st.prog[id]=0;
  timer=setInterval(()=>{st.prog[id]=Math.min(100,(st.prog[id]||0)+2);$("#pi").style.width=st.prog[id]+"%";if(st.prog[id]%10===0)D.saveUser();if(st.prog[id]>=100){clearInterval(timer);timer=null;b.textContent="↻";D.saveUser()}},400);
}
function toggleList(id){const i=st.list.indexOf(id);i>=0?st.list.splice(i,1):st.list.push(id);D.saveUser();
  $("#sv").textContent=i>=0?"+ লিস্টে":"✓ সেভড";toast(i>=0?"লিস্ট থেকে সরানো হয়েছে":"লিস্টে যোগ হয়েছে")}

/* ====== ADMIN / PROFILE ====== */
async function saveT(id){
  const t={t:$("#a_t").value.trim(),c:$("#a_c").value,y:+$("#a_y").value||"",d:$("#a_d").value.trim(),yt:ytId($("#a_yt").value),s:$("#a_s").value.trim()};
  if(!t.t)return toast("নাম দিন");
  if(id){t.id=id;t.ts=T(id).ts}
  try{await D.saveTitle(t);st.edit=null;toast(id?"আপডেট হয়েছে":"যোগ হয়েছে");render()}catch(e){toast("সেভ হয়নি: Rules/অ্যাডমিন চেক করুন")}
}
function editT(id){st.edit={...T(id)};render();$("#main").scrollTop=0}
async function delT(id){if(confirm("মুছে ফেলবেন?")){try{await D.delTitle(id);toast("মুছে ফেলা হয়েছে")}catch(e){toast("মোছা যায়নি")}}}
function rename(){const n=prompt("আপনার নাম:",st.user.name);if(n){st.user.name=n.slice(0,30);D.saveUser();render()}}
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),1600)}
D.init();
</script>
</body>
</html>

name: Build CINEVERSE APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Arrange files
        run: |
          mkdir -p app/src/main/java/com/cineverse/app app/src/main/assets app/src/main/res/drawable
          mv app-build.gradle.kts app/build.gradle.kts
          mv AndroidManifest.xml app/src/main/AndroidManifest.xml
          mv MainActivity.kt app/src/main/java/com/cineverse/app/MainActivity.kt
          mv index.html app/src/main/assets/index.html
          mv ic_launcher.xml app/src/main/res/drawable/ic_launcher.xml

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Accept Android licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CINEVERSE-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
